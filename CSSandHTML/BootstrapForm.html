<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BootStrap Form</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
        integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <h1 class="display-2">Forms</h1>
        <form action="#nowhere">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="" id="email" placeholder="email">
            </div>
            <div class="form-group">
                <label for="password">password</label>
                <input type="password" name="" id="password" placeholder="password">
            </div>
            <div class="form-group">
                <label for="state">State</label><br>
                <select name="state" class="form-control" id="state">
                    <option value="Al">Alaska</option>
                    <option value="Ala">Alabama</option>
                </select>
            </div>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="defaultCheck1">
                <label for="defaultCheck1" class="form-check-label">Sign Me Up</label>
            </div>
            <p>


            </p>
            <h2 class="display-5"> THIS IS THE CUSTOM CHECKBOX FROM BOOTSTRAP
            </h2>
            <div class="custom-control custom-checkbox">
                <input type="checkbox" class="custom-control-input" id="CustomCheck1">
                <label for="CustomCheck1" class="custom-control-label">Sign Me Up</label>
            </div>
        </form>
    </div>
</body>

</html>
